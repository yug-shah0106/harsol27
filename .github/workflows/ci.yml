name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: harsol27_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d harsol27_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only throwaway values; the database lives and dies with this job.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/harsol27_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/harsol27_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000
      # Local-only storage credentials, the same placeholders as dev/s3.json (the S3 server below).
      S3_ENDPOINT: http://127.0.0.1:8333
      S3_ACCESS_KEY_ID: local-dev-access-key
      S3_SECRET_ACCESS_KEY: local-dev-secret-key-not-for-production
      TEST_S3_BUCKET: harsol27-test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit the packages the live app uses (high or critical fails the build)
        run: pnpm audit --prod --audit-level high
      - name: Start S3-compatible storage (SeaweedFS, as in compose.dev.yml)
        run: |
          docker run -d --name s3 -p 127.0.0.1:8333:8333 -v "$PWD/dev/s3.json:/etc/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -s3 -s3.config=/etc/s3.json -dir=/data
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8333/ && exit 0; sleep 1; done
          echo "storage did not start" && docker logs s3 && exit 1
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build tools image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: tools
          push: false
          cache-from: type=gha
