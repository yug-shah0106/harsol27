# Staging (and later production) stack. Run from the repo root:
#   docker compose -f deploy/compose.yml up -d --build                     # app on http://127.0.0.1:3000
#   docker compose -f deploy/compose.yml --profile ngrok up -d --build     # + public ngrok URL
#   docker compose -f deploy/compose.yml run --rm tools tsx scripts/staff.ts create --email … --name … --role ADMIN
# Settings come from deploy/.env (see deploy/.env.example), never from the developer .env.
name: harsol27

# Every service's log is capped (5 × 10 MB) so logs can never fill the disk.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-app-env: &app-env
  DATABASE_URL: postgresql://harsol27:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/harsol27
  BETTER_AUTH_URL: ${APP_URL:?set APP_URL in deploy/.env}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in deploy/.env}
  CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-forwarded-for}
  SMS_PROVIDER: ${SMS_PROVIDER:-} # sign-in by SMS code is off; leave unset
  ALLOW_CONSOLE_SMS: ${ALLOW_CONSOLE_SMS:-false}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in deploy/.env}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in deploy/.env}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in deploy/.env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in deploy/.env}

services:
  db:
    logging: *logging
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: harsol27
      POSTGRES_USER: harsol27
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harsol27 -d harsol27"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies pending migrations, then exits. The app only starts after it succeeds.
  migrate:
    logging: *logging
    build: { context: .., target: tools }
    image: harsol27-tools
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    logging: *logging
    build: { context: .., target: runner }
    image: harsol27-app
    restart: unless-stopped
    environment: *app-env
    ports:
      - "127.0.0.1:3000:3000" # loopback only; the public route is ngrok (later Cloudflare)
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Background jobs (emails, with retries). Same image as the tools; never exposed to the network.
  worker:
    logging: *logging
    image: harsol27-tools
    restart: unless-stopped
    command: ["tsx", "src/worker.ts"]
    environment:
      DATABASE_URL: postgresql://harsol27:${POSTGRES_PASSWORD}@db:5432/harsol27
      BETTER_AUTH_URL: ${APP_URL}
      NODE_OPTIONS: --conditions=react-server
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TEAM_ALERT_EMAILS: ${TEAM_ALERT_EMAILS:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Nightly database backups (deploy/backup): dump, test-restore into a scratch database, optional
  # off-site copy, 14 days kept on this server. Restore: see deploy/README.md.
  backup:
    logging: *logging
    build: { context: ./backup }
    image: harsol27-backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: harsol27
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: harsol27
      BACKUP_AT_UTC: ${BACKUP_AT_UTC:-21:00} # 02:30 India time
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - backups:/backups
    depends_on:
      migrate: { condition: service_completed_successfully }

  # One-off admin commands: `docker compose -f deploy/compose.yml run --rm tools tsx scripts/staff.ts …`
  # and the go-live check: `… run --rm tools tsx scripts/preflight.ts`
  tools:
    logging: *logging
    image: harsol27-tools
    profiles: [tools]
    environment:
      <<: *app-env
      NODE_OPTIONS: --conditions=react-server
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TEAM_ALERT_EMAILS: ${TEAM_ALERT_EMAILS:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
    depends_on:
      db: { condition: service_healthy }

  # Local stand-in for Cloudflare R2, for running this stack without an R2 bucket. Not for real data.
  s3:
    logging: *logging
    image: chrislusf/seaweedfs:4.48
    profiles: [local-s3]
    restart: unless-stopped
    command: ["server", "-s3", "-s3.config=/etc/s3.json", "-dir=/data"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ../dev/s3.json:/etc/s3.json:ro
      - s3data:/data

  ngrok:
    logging: *logging
    image: ngrok/ngrok:3.39.11-alpine
    profiles: [ngrok]
    restart: unless-stopped
    command: ["http", "app:3000", "--url", "${APP_URL}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-} # ngrok refuses to start without it
    depends_on:
      app: { condition: service_healthy }

volumes:
  pgdata:
  s3data:
  backups:
