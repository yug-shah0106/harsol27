allowBuilds:
  sharp: false
  '@swc/core': false # a dependency of @serwist/turbopack it does not call; its install script is not needed
  unrs-resolver: false
  '@prisma/engines': true
  prisma: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@next/env@16.4.0'
  - '@next/eslint-plugin-next@16.4.0'
  - '@next/swc-darwin-arm64@16.4.0'
  - '@next/swc-darwin-x64@16.4.0'
  - '@next/swc-linux-arm64-gnu@16.4.0'
  - '@next/swc-linux-arm64-musl@16.4.0'
  - '@next/swc-linux-x64-gnu@16.4.0'
  - '@next/swc-linux-x64-musl@16.4.0'
  - '@next/swc-win32-arm64-msvc@16.4.0'
  - '@next/swc-win32-x64-msvc@16.4.0'
  - eslint-config-next@16.4.0
  - next@16.4.0
overrides:
  # An optional Better Auth peer we never use (Postgres only); pinned past GHSA-rgwj-5xj2-c3m3 and its
  # mysql_clear_password advisory so the production audit stays clean.
  mysql2: ^3.24.5
